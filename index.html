<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothing Shop - WebSys 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Streetwear Shop</h1>
        <div class="cart-icon">
            🛒 <span id="cart-count">0</span>
        </div>
    </header>

    <main>
        <section id="product-list" class="products-grid">
            </section>

        <aside id="shopping-cart">
            <h2>Your Cart</h2>
            <div id="cart-items">
                </div>
            <div id="empty-msg">Your cart is empty.</div>
            
            <hr>
            <div class="cart-summary">
                <p>Total: ₱<span id="cart-total">0</span></p>
                <button id="clear-cart" class="btn-clear">Clear Cart</button>
                <button id="checkout-btn" class="btn-checkout">Checkout</button>
            </div>
        </aside>
    </main>

    <script src="script.js"></script>
</body>
</html>
